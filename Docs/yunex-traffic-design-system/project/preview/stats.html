<!doctype html><html><head>
<meta charset="utf-8"><title>Stat Block</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:28px 32px;background:#fff;color:#000;font-family:var(--font-body);}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:32px;}
  .stat .num{font-family:var(--font-display);font-weight:700;font-size:54px;letter-spacing:-0.025em;line-height:1;}
  .stat .num .plus{color:#1E2ED9;}
  .stat .label{font-size:13px;color:var(--fg-muted);margin-top:6px;line-height:1.4;}
</style></head><body>
<div class="grid">
  <div class="stat"><div class="num"><span class="plus">+</span>1,936</div><div class="label">vehicles managed per minute</div></div>
  <div class="stat"><div class="num">−18%</div><div class="label">average delay across managed corridors</div></div>
  <div class="stat"><div class="num">600+</div><div class="label">cities running Yunex Traffic</div></div>
</div>
</body></html>
