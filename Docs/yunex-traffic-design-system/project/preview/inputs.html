<!doctype html><html><head>
<meta charset="utf-8"><title>Inputs</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:#fff;font-family:var(--font-body);}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .field label{display:block;font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:var(--fg-muted);margin-bottom:6px;font-weight:500;}
  .field input, .field select, .field textarea{width:100%;font-family:var(--font-body);font-size:15px;padding:12px 14px;border:1px solid #000;border-radius:8px;background:#fff;color:#000;outline:none;box-sizing:border-box;}
  .field input:focus{border-color:#1E2ED9;box-shadow:0 0 0 3px rgba(30,46,217,0.18);}
  .field input::placeholder{color:#9aa3a8;}
  .field-error input{border-color:#F47738;}
  .err{font-size:12px;color:#F47738;margin-top:4px;}
  .check{display:flex;align-items:center;gap:10px;font-size:14px;}
  .check input{width:18px;height:18px;accent-color:#1E2ED9;}
</style></head><body>
<div class="grid">
  <div class="field"><label>Email</label><input value="you@yunextraffic.com"></div>
  <div class="field"><label>City</label><select><option>Birmingham</option><option>London</option></select></div>
  <div class="field field-error"><label>Phone</label><input value="abc"><div class="err">Use digits only.</div></div>
  <div class="field"><label>Topic</label><input placeholder="What are you looking for?"></div>
</div>
<div style="display:flex;gap:24px;margin-top:18px;">
  <label class="check"><input type="checkbox" checked> I agree to the privacy policy</label>
  <label class="check"><input type="radio" name="r" checked> Public sector</label>
  <label class="check"><input type="radio" name="r"> Private operator</label>
</div>
</body></html>
