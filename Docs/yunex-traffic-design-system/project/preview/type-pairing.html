<!doctype html><html><head>
<meta charset="utf-8"><title>Type Pairing</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:28px 32px;background:#fff;color:#000;}
  h2{font-family:var(--font-display);font-weight:700;font-size:36px;letter-spacing:-0.02em;line-height:1.05;margin:0 0 12px;}
  p{font-family:var(--font-body);font-size:15px;line-height:1.55;margin:0 0 8px;max-width:60ch;}
  .quote{font-family:var(--font-display);font-weight:400;font-size:22px;line-height:1.3;color:#1E2ED9;margin-top:18px;}
  .callout-tag{font-family:var(--font-body);font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--fg-muted);margin-bottom:6px;}
</style></head><body>
<div class="callout-tag">Headline + body pairing</div>
<h2>We protect your assets</h2>
<p>With the broadest end-to-end portfolio of intelligent traffic management solutions, we enable cities and operators to make road networks intelligent.</p>
<div class="quote">"Technology is our craft.<br>We don't talk about innovation — we do it."</div>
</body></html>
