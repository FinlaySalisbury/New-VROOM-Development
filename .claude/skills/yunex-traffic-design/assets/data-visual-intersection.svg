
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Yunex data visual">
  <defs>
    <linearGradient id="dv-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#688ABA"></stop>
      <stop offset="1" stop-color="#DEECFF"></stop>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#dv-bg)"></rect>

  
  <g fill="#FFFFFF" opacity="0.9">
    <rect x="0" y="170" width="600" height="60"></rect>
    <rect x="270" y="0" width="60" height="400"></rect>
  </g>
  <g stroke="#000" stroke-width="2" stroke-dasharray="14 10">
    <line x1="0" y1="200" x2="600" y2="200"></line>
    <line x1="300" y1="0" x2="300" y2="400"></line>
  </g>

  
  <g fill="#1E2ED9">
    <circle cx="120" cy="200" r="6"></circle>
    <circle cx="180" cy="200" r="6"></circle>
    <circle cx="240" cy="200" r="6"></circle>
    <circle cx="300" cy="120" r="6"></circle>
    <circle cx="300" cy="60" r="6"></circle>
  </g>

  
  <g transform="translate(360,40)">
    <text font-family="Manrope, system-ui, sans-serif" font-weight="700" font-size="56" fill="#000">+1.936</text>
    <text y="32" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#000">vehicles / hour</text>
  </g>
</svg>