
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-label="Yunex city illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DEECFF"></stop>
      <stop offset="1" stop-color="#FFFFFF"></stop>
    </linearGradient>
    <linearGradient id="lagoon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E2ED9"></stop>
      <stop offset="0.55" stop-color="#9DBBFF"></stop>
      <stop offset="1" stop-color="#AFFAD7"></stop>
    </linearGradient>
  </defs>

  
  <rect width="720" height="420" fill="url(#bg)"></rect>

  
  <g fill="#E4EDED">
    <rect x="0" y="240" width="100" height="180"></rect>
    <rect x="100" y="200" width="60" height="220"></rect>
    <rect x="160" y="260" width="80" height="160"></rect>
    <rect x="240" y="180" width="50" height="240"></rect>
    <rect x="290" y="220" width="70" height="200"></rect>
    <rect x="360" y="170" width="60" height="250"></rect>
    <rect x="420" y="240" width="90" height="180"></rect>
    <rect x="510" y="200" width="50" height="220"></rect>
    <rect x="560" y="260" width="80" height="160"></rect>
    <rect x="640" y="220" width="80" height="200"></rect>
    
    <g fill="#DEECFF">
      <rect x="20" y="270" width="6" height="8"></rect>
      <rect x="40" y="270" width="6" height="8"></rect>
      <rect x="60" y="270" width="6" height="8"></rect>
      <rect x="20" y="290" width="6" height="8"></rect>
      <rect x="40" y="290" width="6" height="8"></rect>
      <rect x="60" y="290" width="6" height="8"></rect>
    </g>
  </g>

  
  <line x1="0" y1="380" x2="720" y2="380" stroke="#000" stroke-width="2"></line>

  
  <rect x="0" y="380" width="720" height="40" fill="#000"></rect>
  <g stroke="#FFE564" stroke-width="3" stroke-dasharray="20 16">
    <line x1="0" y1="400" x2="720" y2="400"></line>
  </g>

  
  <g transform="translate(330,170)">
    
    <rect x="28" y="120" width="4" height="90" fill="#000"></rect>
    
    <rect x="0" y="0" width="60" height="130" rx="14" fill="#000"></rect>
    
    <circle cx="30" cy="28" r="14" fill="url(#lagoon)"></circle>
    <circle cx="30" cy="65" r="14" fill="#FFE564"></circle>
    <circle cx="30" cy="102" r="14" fill="#00E38C"></circle>
  </g>

  
  <rect x="0" y="0" width="240" height="420" fill="url(#bg)" opacity="0.4"></rect>
</svg>