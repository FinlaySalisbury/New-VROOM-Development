<!doctype html>
<!-- @dsCard group="Brand" name="Logo" subtitle="Wordmark on light + dark" viewport="700x200" --><html><head>
<meta charset="utf-8"><title>Logo</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:0;background:#fff;font-family:var(--font-body);}
  .row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;height:200px;}
  .cell{display:flex;align-items:center;justify-content:center;padding:20px;}
  .light{background:#fff;}
  .grad{background:linear-gradient(135deg,#688ABA 0%,#FFFFFF 38%,#DEECFF 70%,#AFFAD7 100%);}
  .dark{background:#000;}
  .cell img{max-width:90%;max-height:140px;object-fit:contain;display:block;}
</style></head><body>
<div class="row">
  <div class="cell light"><img src="../assets/logo-yunex-traffic-black.png" alt="Yunex Traffic"></div>
  <div class="cell grad"><img src="../assets/logo-yunex-traffic-gradient.png" alt="Yunex Traffic"></div>
  <div class="cell dark"><img src="../assets/logo-yunex-traffic-white.png" alt="Yunex Traffic"></div>
</div>
</body></html>
