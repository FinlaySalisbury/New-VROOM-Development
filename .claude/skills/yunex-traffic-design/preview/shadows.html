<!doctype html>
<!-- @dsCard group="Spacing" name="Shadows" subtitle="sm, md, lg, focus glow" viewport="700x180" --><html><head>
<meta charset="utf-8"><title>Shadows</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:32px;background:#F7FAFB;font-family:var(--font-body);}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;}
  .card{background:#fff;border-radius:16px;height:100px;display:flex;align-items:flex-end;justify-content:center;padding:10px;}
  .name{font-size:11px;color:var(--fg-muted);letter-spacing:0.05em;text-transform:uppercase;}
  .sm{box-shadow:0 1px 2px rgba(15,28,64,0.06);}
  .md{box-shadow:0 6px 16px rgba(15,28,64,0.08);}
  .lg{box-shadow:0 18px 48px rgba(15,28,64,0.12);}
  .glow{box-shadow:0 0 0 4px rgba(30,46,217,0.18);}
</style></head><body>
<div class="grid">
  <div class="card sm"><div class="name">sm</div></div>
  <div class="card md"><div class="name">md</div></div>
  <div class="card lg"><div class="name">lg</div></div>
  <div class="card glow"><div class="name">focus glow</div></div>
</div>
</body></html>
