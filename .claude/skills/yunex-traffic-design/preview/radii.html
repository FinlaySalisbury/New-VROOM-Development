<!doctype html>
<!-- @dsCard group="Spacing" name="Radii" subtitle="sm → pill" viewport="700x160" --><html><head>
<meta charset="utf-8"><title>Radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:28px;background:#fff;font-family:var(--font-body);}
  .grid{display:flex;gap:18px;align-items:flex-end;}
  .item{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .box{width:80px;height:80px;background:#1E2ED9;}
  .name{font-size:11px;color:var(--fg-muted);letter-spacing:0.05em;text-transform:uppercase;}
  .px{font-size:11px;color:#000;font-variant-numeric:tabular-nums;}
</style></head><body>
<div class="grid">
  <div class="item"><div class="box" style="border-radius:0"></div><div class="name">none</div><div class="px">0</div></div>
  <div class="item"><div class="box" style="border-radius:4px"></div><div class="name">sm</div><div class="px">4 px</div></div>
  <div class="item"><div class="box" style="border-radius:8px"></div><div class="name">md</div><div class="px">8 px</div></div>
  <div class="item"><div class="box" style="border-radius:16px"></div><div class="name">lg</div><div class="px">16 px</div></div>
  <div class="item"><div class="box" style="border-radius:24px"></div><div class="name">xl</div><div class="px">24 px</div></div>
  <div class="item"><div class="box" style="border-radius:999px"></div><div class="name">pill</div><div class="px">full</div></div>
</div>
</body></html>
