<!doctype html>
<!-- @dsCard group="Type" name="Type scale" subtitle="Display → small" viewport="700x340" --><html><head>
<meta charset="utf-8"><title>Type Scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px 32px;background:#fff;color:#000;}
  .row{display:grid;grid-template-columns:90px 1fr;align-items:baseline;gap:18px;padding:8px 0;border-bottom:1px solid #E4EDED;}
  .row:last-child{border-bottom:0;}
  .tag{font-family:var(--font-body);font-size:11px;letter-spacing:0.05em;color:var(--fg-muted);text-transform:uppercase;font-variant-numeric:tabular-nums;}
  .specimen{font-family:var(--font-display);font-weight:600;letter-spacing:-0.02em;line-height:1.05;}
  .body{font-family:var(--font-body);font-weight:400;letter-spacing:0;line-height:1.4;}
</style></head><body>
<div class="row"><div class="tag">Display 72</div><div class="specimen" style="font-size:54px">Uniting</div></div>
<div class="row"><div class="tag">H1 56</div><div class="specimen" style="font-size:42px">What's next in traffic</div></div>
<div class="row"><div class="tag">H2 40</div><div class="specimen" style="font-size:30px">Smart mobility, today</div></div>
<div class="row"><div class="tag">H3 28</div><div class="specimen" style="font-size:22px">Adaptive traffic control</div></div>
<div class="row"><div class="tag">Body 16</div><div class="body" style="font-size:15px">The quick brown fox jumps over the lazy dog.</div></div>
<div class="row"><div class="tag">Small 14</div><div class="body" style="font-size:13px;color:var(--fg-muted)">Caption · meta · timestamp</div></div>
</body></html>
