<!doctype html>
<!-- @dsCard group="Components" name="Buttons" subtitle="Pill primary/secondary/link/gradient" viewport="700x160" --><html><head>
<meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:28px;background:#fff;font-family:var(--font-body);}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
  .btn{font-family:var(--font-body);font-weight:600;font-size:14px;padding:11px 20px;border-radius:999px;border:1px solid transparent;cursor:pointer;letter-spacing:0;transition:opacity .15s,background .15s;display:inline-flex;align-items:center;gap:8px;}
  .btn-primary{background:#000;color:#fff;}
  .btn-primary:hover{background:#1E2ED9;}
  .btn-secondary{background:#fff;color:#000;border-color:#000;}
  .btn-secondary:hover{background:#000;color:#fff;}
  .btn-link{background:transparent;color:#1E2ED9;padding:11px 0;border:0;border-bottom:1px solid #1E2ED9;border-radius:0;}
  .btn-grad{background:linear-gradient(135deg,#1E2ED9,#9DBBFF);color:#fff;}
  .btn-sm{font-size:13px;padding:8px 14px;}
  .btn-lg{font-size:15px;padding:14px 26px;}
  .arrow{display:inline-block;width:16px;height:1.5px;background:currentColor;position:relative;}
  .arrow:after{content:"";position:absolute;right:-1px;top:-3px;width:7px;height:7px;border-top:1.5px solid currentColor;border-right:1.5px solid currentColor;transform:rotate(45deg);}
</style></head><body>
<div class="row">
  <button class="btn btn-primary">Get in touch <span class="arrow"></span></button>
  <button class="btn btn-secondary">Read more</button>
  <button class="btn btn-grad">Explore solutions</button>
  <a class="btn btn-link" href="#">Learn more <span class="arrow"></span></a>
</div>
<div class="row">
  <button class="btn btn-primary btn-sm">Small</button>
  <button class="btn btn-primary">Default</button>
  <button class="btn btn-primary btn-lg">Large</button>
  <button class="btn btn-secondary" disabled style="opacity:0.4;cursor:not-allowed">Disabled</button>
</div>
</body></html>
